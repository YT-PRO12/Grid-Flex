name: Verify synthetic scenario contracts

on:
  push:
    paths:
      - 'app.py'
      - 'tests/test_lambda_gateway_body_nov25.py'
      - 'engine/scenario.py'
      - 'engine/verification.py'
      - 'tests/test_verification_*.py'
      - 'tests/test_scenario_*nov20.py'
      - '.github/workflows/scenario-contract.yml'
  pull_request:
    paths:
      - 'app.py'
      - 'tests/test_lambda_gateway_body_nov25.py'
      - 'engine/scenario.py'
      - 'engine/verification.py'
      - 'tests/test_verification_*.py'
      - 'tests/test_scenario_*nov20.py'
      - '.github/workflows/scenario-contract.yml'

permissions:
  contents: read

jobs:
  scenario-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optimizer dependencies
        run: python -m pip install -r requirements.txt
      - name: Run deterministic scenario contract tests
        run: |
          python -m unittest discover -s tests -p 'test_scenario_*nov20.py' -v
          python -m unittest discover -s tests -p 'test_verification_*.py' -v
          python -m unittest discover -s tests -p 'test_lambda_gateway_body_nov25.py' -v
